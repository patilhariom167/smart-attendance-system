<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Holidays - Smart Attendance</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 700px;">
        <a href="/dashboard" class="btn btn-secondary mb-3 fw-bold">← Back to Dashboard</a>
        <div class="card shadow p-4 rounded-4 border-0">
            <h3 class="mb-4 text-secondary">Manage Public Holidays</h3>
            
            <!-- Add Holiday Form -->
            <form method="POST" class="mb-4">
                <div class="mb-3">
                    <label class="form-label fw-bold">Holiday Date</label>
                    <input type="date" class="form-control" name="date" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Holiday Name</label>
                    <input type="text" class="form-control" name="name" placeholder="e.g. Republic Day / Diwali" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Add Holiday</button>
            </form>

            <hr>

            <!-- Holidays List Table -->
            <h4 class="mb-3 text-dark">Existing Holidays List</h4>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Date</th>
                            <th>Holiday Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for h in holidays %}
                        <tr>
                            <td>{{ h.date }}</td>
                            <td><b>{{ h.name }}</b></td>
                            <td>
                                <a href="/delete_holiday/{{ h.id }}" class="btn btn-sm btn-danger fw-bold" onclick="return confirm('Are you sure you want to delete this holiday?');">Delete</a>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3" class="text-center text-muted py-3">No holidays added yet.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
