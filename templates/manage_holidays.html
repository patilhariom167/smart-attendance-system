<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Holidays - Smart Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Smart Attendance System</a>
            <a href="/dashboard" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Manage Holidays</h2>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">Add New Holiday</div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-5 mb-3">
                            <label for="holiday_name" class="form-label">Holiday Name</label>
                            <input type="text" class="form-control" id="holiday_name" name="holiday_name" required>
                        </div>
                        <div class="col-md-5 mb-3">
                            <label for="holiday_date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="holiday_date" name="holiday_date" required>
                        </div>
                        <div class="col-md-2 mb-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-success w-100">Add Holiday</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">Holiday List</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Holiday Name</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% if holidays %}
                                {% for holiday in holidays %}
                                <tr>
                                    <td>{{ holiday.name }}</td>
                                    <td>{{ holiday.date }}</td>
                                </tr>
                                {% endfor %}
                            {% else %}
                                <tr>
                                    <td colspan="2" class="text-center text-muted">No holidays added yet.</td>
                                </tr>
                            {% endif %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
