<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee - Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow p-4 rounded-4">
            <h3 class="mb-4 text-center">Edit Employee Details</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" value="{{ employee.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" name="email" value="{{ employee.email }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Branch</label>
                    <input type="text" class="form-control" name="branch" value="{{ employee.branch }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Shift</label>
                    <select class="form-control" name="shift">
                        <option value="Shift 1 (9 AM)" {% if employee.shift == 'Shift 1 (9 AM)' %}selected{% endif %}>Shift 1 (9 AM)</option>
                        <option value="Shift 2 (2 PM)" {% if employee.shift == 'Shift 2 (2 PM)' %}selected{% endif %}>Shift 2 (2 PM)</option>
                        <option value="Shift 3 (10 PM)" {% if employee.shift == 'Shift 3 (10 PM)' %}selected{% endif %}>Shift 3 (10 PM)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fingerprint ID</label>
                    <input type="number" class="form-control" name="fingerprint_id" value="{{ employee.fingerprint_id if employee.fingerprint_id else '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Basic Salary (₹)</label>
                    <input type="number" step="0.01" class="form-control" name="basic_salary" value="{{ employee.basic_salary }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Advance Salary Deduction (₹)</label>
                    <input type="number" step="0.01" class="form-control" name="advance_salary" value="{{ employee.advance_salary }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Bonus (₹)</label>
                    <input type="number" step="0.01" class="form-control" name="bonus" value="{{ employee.bonus }}">
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/dashboard" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update Details</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
