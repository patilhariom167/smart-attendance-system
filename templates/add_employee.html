<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Employee</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 50px; background-color: #f4f6f9;">
    <div style="max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1);">
        <h2>Add New Employee / Student</h2>
        <form method="POST">
            <label>Name:</label><br>
            <input type="text" name="name" required style="width: 100%; padding: 8px; margin: 8px 0;"><br>
            
            <label>Email:</label><br>
            <input type="email" name="email" required style="width: 100%; padding: 8px; margin: 8px 0;"><br>
            
            <label>Password:</label><br>
            <input type="password" name="password" required style="width: 100%; padding: 8px; margin: 8px 0;"><br>
            
            <label>Role:</label><br>
            <select name="role" style="width: 100%; padding: 8px; margin: 8px 0;">
                <option value="Employee">Employee</option>
                <option value="Admin">Admin</option>
            </select><br>

            <!-- Navin Branch Selection -->
            <label>Branch:</label><br>
            <select name="branch" style="width: 100%; padding: 8px; margin: 8px 0;">
                <option value="Head Office">Head Office</option>
                <option value="Mumbai Branch">Mumbai Branch</option>
                <option value="Pune Branch">Pune Branch</option>
                <option value="Nagpur Branch">Nagpur Branch</option>
            </select><br>

            <!-- Navin Shift Selection -->
            <label>Shift Time:</label><br>
            <select name="shift" style="width: 100%; padding: 8px; margin: 8px 0;">
                <option value="Morning (9 AM - 6 PM)">Morning (9 AM - 6 PM)</option>
                <option value="Evening (2 PM - 11 PM)">Evening (2 PM - 11 PM)</option>
                <option value="Night (10 PM - 7 AM)">Night (10 PM - 7 AM)</option>
            </select><br>
            
            <label>Fingerprint ID:</label><br>
            <input type="number" name="fingerprint_id" style="width: 100%; padding: 8px; margin: 8px 0;"><br>

            <label>Basic Salary (₹):</label><br>
            <input type="number" step="0.01" name="basic_salary" value="15000.0" required style="width: 100%; padding: 8px; margin: 8px 0;"><br><br>
            
            <button type="submit" style="width: 100%; background: #28a745; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Add Employee</button>
        </form>
        <br>
        <a href="/dashboard">Back to Dashboard</a>
    </div>
</body>
</html>
